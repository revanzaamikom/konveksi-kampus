# Netlify configuration — KonveksiKampus (Standard, static export)
#
# Production deployment target. Preview-to-client uses `cloudflared` against the
# local dev server instead (see docs/DEPLOY.md), so no deploy needed for previews.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# Next.js static export produces .html files; clean URLs are handled natively.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
